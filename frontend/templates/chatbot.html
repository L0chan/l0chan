<!DOCTYPE html>
<html>
<head>
    <title>AI Shopping Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='pro-redesign.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site-theme.css') }}">
</head>

<body data-panel="chat">

<div class="chat-box">
    <div class="header">
        🤖 AI Shopping Assistant
    </div>

    <div class="messages" id="messages">
        <div class="bot">
            👋 Hello! Ask about products.
        </div>
    </div>

    <div class="input-box">
        <input type="text" id="message" placeholder="Search products...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function sendMessage(){
    let msg = document.getElementById("message").value;
    if(msg == ""){
        return;
    }
    let messages = document.getElementById("messages");
    messages.innerHTML += `
    <div class="user" style="margin-left:auto; width:fit-content; margin-bottom:15px; padding:15px; border-radius:15px;">
        ${msg}
    </div>
    `;
    fetch("/chat_response",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:"message="+msg
    })
    .then(response => response.json())
    .then(data => {
        messages.innerHTML += `
        <div class="bot" style="margin-bottom:15px; padding:15px; border-radius:15px; width:fit-content;">
            ${data.reply}
        </div>
        `;
        messages.scrollTop = messages.scrollHeight;
    });
    document.getElementById("message").value = "";
}
</script>
</body>
</html>
